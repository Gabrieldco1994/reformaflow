name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build Domain package
        run: npm --workspace @reformaflow/domain run build
      - name: Generate Prisma Client
        run: npx prisma@5 generate --schema=prisma/schema.prisma
      - name: Validate agent contracts
        run: npm run test:agent-contracts
      - name: Type check - Domain
        run: cd packages/domain && npx tsc --noEmit
      - name: Type check - API
        run: cd apps/api && npx tsc --noEmit
      - name: Type check - Web
        run: cd apps/web && npx tsc --noEmit

  test-domain:
    name: Test Domain Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm --workspace @reformaflow/domain run test

  test-api:
    name: Test API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build Domain package
        run: npm --workspace @reformaflow/domain run build
      - name: Generate Prisma Client
        run: npx prisma@5 generate --schema=prisma/schema.prisma
      - name: Prepare disposable test database (63 committed migrations)
        run: npm run test:db:prepare
      - name: Synthetic finance-center fixture contract (UTC)
        run: cd apps/api && TZ=UTC npx jest src/monthly-overview/finance-center.fixture.integration.spec.ts --runInBand
      - name: Synthetic finance-center fixture contract (America/Sao_Paulo)
        run: cd apps/api && TZ=America/Sao_Paulo npx jest src/monthly-overview/finance-center.fixture.integration.spec.ts --runInBand
      - name: Financing soft-delete reactivation e2e (UTC)
        run: cd apps/api && TZ=UTC npx ts-node -T src/financing/__tests__/e2e-soft-delete-reactivation.test.ts
      - name: Financing soft-delete reactivation e2e (America/Sao_Paulo)
        run: cd apps/api && TZ=America/Sao_Paulo npx ts-node -T src/financing/__tests__/e2e-soft-delete-reactivation.test.ts
      - name: Run tests
        run: npm --workspace @reformaflow/api run test -- --no-coverage

  test-web:
    name: Test Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build Domain package
        run: npm --workspace @reformaflow/domain run build
      - name: Run tests
        run: npm --workspace @reformaflow/web run test

  e2e-web:
    name: E2E Web (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build Domain package
        run: npm --workspace @reformaflow/domain run build
      - name: Install Playwright browser
        run: npm --workspace @reformaflow/web exec playwright install --with-deps chromium
      - name: Run E2E responsive tests
        run: npm --workspace @reformaflow/web run test:e2e

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test-domain, test-api, test-web, e2e-web]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build Domain package
        run: npm --workspace @reformaflow/domain run build
      - name: Build Next.js
        run: npm --workspace @reformaflow/web run build
        env:
          NEXT_PUBLIC_API_URL: https://reformaflow-api.fly.dev

  build-api:
    name: Build API
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test-domain, test-api, test-web, e2e-web]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build Domain package
        run: npm --workspace @reformaflow/domain run build
      - name: Generate Prisma Client
        run: npx prisma@5 generate --schema=prisma/schema.prisma
      - name: Build NestJS
        run: npm --workspace @reformaflow/api run build

  deploy-api:
    name: Deploy API to Fly
    runs-on: ubuntu-latest
    needs: [build-api, build-web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: deploy-api
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to Fly
        run: flyctl deploy -c apps/api/fly.toml --dockerfile apps/api/Dockerfile --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
